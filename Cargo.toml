[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/krakerz/Thermaltake-500-LCD-Linux"

[workspace.dependencies]
tt500-lcd-protocol = { path = "crates/protocol" }
tt500-lcd-render = { path = "crates/render" }
tt500-lcd-ipc = { path = "crates/ipc" }
tt500-lcd-setup = { path = "crates/setup" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0.0"
hidapi = "2.6.7"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "jpeg", "webp", "bmp"] }
jpeg-encoder = "0.7.1"
signal-hook = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
thiserror = "2"
rustix = { version = "1", features = ["fs", "process"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
