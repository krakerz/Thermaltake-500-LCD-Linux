<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- TT500 LCD: a bold "TT" with a smaller "500" badge overlapping the bottom right. -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#17191f"/>
  <g fill="#f4f4f6">
    <!-- First T -->
    <rect x="14" y="20" width="46" height="15" rx="2"/>
    <rect x="29.5" y="20" width="15" height="76" rx="2"/>
    <!-- Second T -->
    <rect x="66" y="20" width="46" height="15" rx="2"/>
    <rect x="81.5" y="20" width="15" height="76" rx="2"/>
  </g>
  <!-- "500" badge, cut out from the T with a background-coloured outline -->
  <rect x="52" y="74" width="68" height="40" rx="10" fill="#ff6b35" stroke="#17191f" stroke-width="5"/>
  <g fill="none" stroke="#17191f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 5 -->
    <path d="M74 83 H62 V93 H69 Q74 93 74 98.5 Q74 105 68 105 H62"/>
    <!-- 0 -->
    <rect x="80" y="83" width="12" height="22" rx="6"/>
    <!-- 0 -->
    <rect x="98" y="83" width="12" height="22" rx="6"/>
  </g>
</svg>
